name: Tauri Build & Test

on:
  push:
    branches:
      - main
      - tauri-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS Tests & Typecheck
        run: |
          npm run typecheck
          npm test

      - name: Build frontend for Tauri
        run: npm run build

      - name: Check & Test Tauri backend
        run: |
          cd src-tauri
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

      - name: Build Linux bundles (deb & rpm)
        if: matrix.os == 'ubuntu-latest'
        run: npx tauri build --bundles deb,rpm

      - name: Build Windows bundle (nsis .exe)
        if: matrix.os == 'windows-latest'
        run: npx tauri build --bundles nsis

      - name: Upload Linux Bundles (deb & rpm)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: turtle-deck-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      - name: Upload Windows Bundle (.exe)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: turtle-deck-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
