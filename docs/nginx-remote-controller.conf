# docs/nginx-remote-controller.conf — Cấu hình mẫu Nginx Reverse Proxy cho Turtle Deck Phone Remote
# Đặt file này vào /etc/nginx/conf.d/turtle-deck.conf hoặc /etc/nginx/sites-available/

server {
    listen 80;
    # Đổi thành tên miền nội bộ của bạn (vd: study.local) hoặc IP của máy
    server_name study.local 192.168.1.100;

    # Tối ưu kích thước header
    client_max_body_size 10M;

    # 1. Định tuyến toàn bộ traffic vào máy chủ Turtle Deck Remote (cổng mặc định 8765)
    location / {
        proxy_pass http://127.0.0.1:8765;

        # Bắt buộc HTTP 1.1 cho SSE và keep-alive
        proxy_http_version 1.1;

        # Các header chuyển tiếp chuẩn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình quan trọng cho Server-Sent Events (SSE realtime):
        # Tắt buffer để dữ liệu sự kiện được đẩy ngay lập tức về điện thoại
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
